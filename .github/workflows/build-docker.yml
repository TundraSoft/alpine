name: Build and Test Docker Image

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    paths-ignore:
      - .dockerignore
      - .gitignore
      - .github/ISSUE_TEMPLATE/*
      - .github/PULL_REQUEST_TEMPLATE*
      - README.md
      - LICENSE
    # Ignore CI if commit message contains '[skip ci]' (e.g., from update-readme chore)
    # This is a GitHub Actions convention, not a YAML field, so we use a job-level if below
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly builds on Sundays at midnight UTC to catch latest Alpine patches
    - 
      cron: '0 0 * * 0'

jobs:

  setup:
    permissions:
      contents: read
    if: |
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      alpine-branches: ${{ steps.alpine-versions.outputs.alpine-branches }}
      latest-alpine-branch: ${{ steps.alpine-versions.outputs.latest-alpine-branch }}
      # s6-versions: ${{ steps.s6-versions.outputs.s6-versions }}
      latest-s6-version: ${{ steps.s6-versions.outputs.latest-s6-version }}

    steps:
      - 
        name: Get Alpine Versions
        id: alpine-versions
        run: |
          # Get the latest stable branch for comparison
          LATEST_BRANCH=$(curl -s https://cz.alpinelinux.org/alpine/latest-stable/releases/x86_64/latest-releases.yaml | awk '/branch:/ {print $2; exit}')
          
          # Build list of branches to test (edge + last 3 stable branches)
          ALPINE_BRANCHES="edge "
          LIMIT=3
          ALL_BRANCHES=$(curl -s https://cz.alpinelinux.org/alpine/ | grep -oP '(?<=v)[^/]+(?=/")' | sort -V | tail -n 6 | tac)
          for BRANCH in $ALL_BRANCHES
          do
            if curl --output /dev/null --silent --head --fail "https://cz.alpinelinux.org/alpine/v${BRANCH}/releases/";
            then
              ALPINE_BRANCHES+="v${BRANCH} "
              LIMIT=$((LIMIT-1))
            fi
            if [ $LIMIT -le 0 ]; then
              break
            fi
          done
          
          # Output as JSON array
          ALPINE_BRANCHES=$(echo $ALPINE_BRANCHES | tr ' ' '\n' | jq -Rcn '[inputs] | sort | reverse')
          echo "alpine-branches=${ALPINE_BRANCHES}" >> "$GITHUB_OUTPUT"
          echo "latest-alpine-branch=${LATEST_BRANCH}" >> "$GITHUB_OUTPUT"
          
      - 
        name: Get S6 Versions
        id: s6-versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authenticated to lift the 60/hr anonymous GitHub API limit, which
          # otherwise returns an empty tag_name -> S6_VERSION "null" -> "vnull"
          # -> a 404 at image build time.
          RELEASES=$(curl -s --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/just-containers/s6-overlay/releases)
          # s6-overlay uses 4-part versions (e.g. 3.2.3.2); take the highest.
          LATEST_VERSION=$(printf '%s' "$RELEASES" | jq -r '.[].tag_name' | grep -oP '^v[0-9]+(\.[0-9]+)+' | sort -V | tail -n 1)
          LATEST_VERSION="${LATEST_VERSION#v}"
          [ -n "$LATEST_VERSION" ] || { echo "Failed to resolve S6 version"; exit 1; }
          echo "latest-s6-version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"
      
  build:
    needs: setup
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
      
    strategy:
      fail-fast: false
      matrix:
        alpine-branch: ${{ fromJson(needs.setup.outputs.alpine-branches) }}
        # s6-version: ${{ fromJson(needs.setup.outputs.s6-versions) }}
    
    env:
      TEST_TAG: alpine-s6
    
    steps:
    - 
      uses: actions/checkout@v6
    
    - 
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    
    -
      name: Get the ALPINE VERSION
      id: get-version
      run: |
        if [ "${{ matrix.alpine-branch }}" = "edge" ]; then
          echo "ALPINE_VERSION=edge" >> $GITHUB_ENV
          echo "alpine-version=edge" >> $GITHUB_OUTPUT
        else
          VERSION=$(curl -s https://cz.alpinelinux.org/alpine/${{ matrix.alpine-branch }}/releases/x86_64/latest-releases.yaml | awk '/version:/ {print $2; exit}')
          echo "ALPINE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "alpine-version=${VERSION}" >> $GITHUB_OUTPUT
        fi
    
    - 
      name: Extract Docker Metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        flavor: |
          latest=false
        images: |
          name=${{ github.repository }},enable=true
          name=ghcr.io/${{ github.repository }},enable=true
        labels: |
          org.opencontainers.image.title=Alpine Linux with S6 Overlay
          org.opencontainers.image.description=Lightweight, secure Alpine Linux base image with S6 overlay, cron, and envsubst
          org.opencontainers.image.vendor=TundraSoft
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.url=${{ github.repositoryUrl }}
          org.opencontainers.image.documentation=${{ github.repositoryUrl }}/blob/main/README.md
          org.opencontainers.image.source=${{ github.repositoryUrl }}.git
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=${{ github.event.repository.pushed_at }}
          org.opencontainers.image.authors=${{ github.actor }}
          org.opencontainers.image.branch=${{ github.ref_name }}
        tags: |
          type=raw,prefix=,value=latest,enable=${{ ( matrix.alpine-branch == needs.setup.outputs.latest-alpine-branch && matrix.alpine-branch != 'edge' && github.ref_name == github.event.repository.default_branch) }}
          # Version tags for non-edge releases (Major.Minor.Patch, Major.Minor, Major)
          type=semver,pattern={{version}},value=${{ steps.get-version.outputs.alpine-version }},enable=${{ matrix.alpine-branch != 'edge' && github.ref_name == github.event.repository.default_branch }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.get-version.outputs.alpine-version }},enable=${{ matrix.alpine-branch != 'edge' && github.ref_name == github.event.repository.default_branch }}
          type=semver,pattern={{major}},value=${{ steps.get-version.outputs.alpine-version }},enable=${{ matrix.alpine-branch != 'edge' && matrix.alpine-branch == needs.setup.outputs.latest-alpine-branch && github.ref_name == github.event.repository.default_branch }}
          # Edge version tags
          type=raw,value=edge,enable=${{ matrix.alpine-branch == 'edge' && github.ref_name == github.event.repository.default_branch }}

    - 
      name: Build Test Image
      id: build-image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: ${{ env.TEST_TAG }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ALPINE_BRANCH=${{ matrix.alpine-branch }}
          S6_VERSION=${{ needs.setup.outputs.latest-s6-version }}
    
    -
      name: Test Image
      run: |
        # Boot the image and assert its full contract: s6, envsubst, default
        # uid/gid, PUID/PGID remap, timezone, cron import, healthcheck, /crons.
        if [ "${{ matrix.alpine-branch }}" = "edge" ]; then
          ./tests/smoke.sh "${{ env.TEST_TAG }}"
        else
          ./tests/smoke.sh "${{ env.TEST_TAG }}" "${{ steps.get-version.outputs.alpine-version }}"
        fi
    
    -
      name: Login to DockerHub
      if: github.ref_name == github.event.repository.default_branch
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    -
      name: Login to GHCR
      if: github.ref_name == github.event.repository.default_branch
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - 
      name: Build and Push
      id: build-push
      if: github.ref_name == github.event.repository.default_branch
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        # Build matrix optimization:
        # - Edge Alpine: amd64 only (QEMU trigger issues on arm)
        # - Stable versions: amd64, arm64, arm/v7 (dropped arm/v6 - EOL)
        platforms: ${{ matrix.alpine-branch == 'edge' && 'linux/amd64' || 'linux/amd64,linux/arm64,linux/arm/v7' }}
        provenance: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ALPINE_BRANCH=${{ matrix.alpine-branch }}
          S6_VERSION=${{ needs.setup.outputs.latest-s6-version }}
    
    -
      name: Get built image size
      if: github.ref_name == github.event.repository.default_branch
      run: |
        echo "## 📦 Image Size Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Alpine | S6 | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|-----|------|" >> $GITHUB_STEP_SUMMARY
        echo "| ${{ matrix.alpine-branch }} | - | - | Pushed to registry |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⚠️ Actual sizes available in Docker Hub: https://hub.docker.com/r/tundrasoft/alpine/tags" >> $GITHUB_STEP_SUMMARY
  
  # Single stable-named check to require in branch protection. The matrix
  # 'build (vX)' names churn as Alpine versions roll; this passes iff the whole
  # build matrix passed. `!cancelled()` ensures it always reports (never blocks
  # a PR as "skipped").
  ci-gate:
    name: ci-gate
    permissions:
      contents: read
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the build matrix to have passed
        run: |
          echo "build matrix result: ${{ needs.build.result }}"
          [ "${{ needs.build.result }}" = "failure" ] && exit 1 || exit 0

  # Lets do a few chores
  update-readme:
    needs: [setup, build]
    permissions:
      contents: read
    if: github.ref_name == github.event.repository.default_branch || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Push the CHANGELOG/README commit with an admin PAT so it can bypass
          # the branch ruleset (Repository admin is on the ruleset bypass list).
          token: ${{ secrets.GIT_HUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements.txt
      
      - name: Update README with new tags
        run: |
          # Use the Alpine branches that were actually built
          ALPINE_BRANCHES='${{ needs.setup.outputs.alpine-branches }}'
          echo "Processing Alpine branches that were built: $ALPINE_BRANCHES"
          
          # Convert JSON array to bash array
          BRANCHES=$(echo "$ALPINE_BRANCHES" | jq -r '.[]')
          
          # Process each branch that was built
          for BRANCH in $BRANCHES; do
            if [ "$BRANCH" != "edge" ]; then
              # Get the version for this branch (same as what was used in build)
              VERSION=$(curl -s "https://cz.alpinelinux.org/alpine/${BRANCH}/releases/x86_64/latest-releases.yaml" | awk '/version:/ {print $2; exit}')
              if [ -n "$VERSION" ]; then
                echo "Updating README with successfully built version: $VERSION"
                python .github/scripts/update_readme_tags.py README.md "$VERSION" "${{ github.repository }}"
              else
                echo "Warning: Could not get version for branch $BRANCH"
              fi
            else
              echo "Skipping edge branch for README update"
            fi
          done
      
      # - name: Generate Docker Hub README
      #   run: |
      #     echo "Generating DOCKER.md for Docker Hub..."
      #     python .github/scripts/generate_docker_readme.py \
      #       README.md \
      #       DOCKER.md \
      #       '${{ needs.setup.outputs.alpine-branches }}' \
      #       '${{ github.repository }}' \
      #       '${{ github.repository }}' \
      #       '${{ needs.setup.outputs.latest-s6-version }}' \
      #       'description:DESCRIPTION-START,DESCRIPTION-END;env-vars:ENV-VARS-START,ENV-VARS-END;build-args:BUILD-ARGS-START,BUILD-ARGS-END'
      
      - name: Update CHANGELOG from PR (on pull_request merge)
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          echo "📝 Processing merged PR for changelog..."
          
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          REPO="${{ github.repository }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "PR Title: $PR_TITLE"
          echo "PR Number: $PR_NUMBER"
          echo "PR Author: $PR_AUTHOR"
          echo "Processing all commits from PR..."
          
          # Call the Python script to update changelog with all PR commits
          python .github/scripts/update_changelog.py CHANGELOG.md "$PR_TITLE" "$PR_NUMBER" "$REPO" "$PR_AUTHOR" "$BASE_SHA" "$HEAD_SHA"
      
      - name: Update CHANGELOG from commits (on main branch push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "📝 Processing commits for changelog..."
          
          # Get the last commit message from the push
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_HASH=$(git log -1 --pretty=%h)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an | sed 's/ /_/g')
          
          # Only process if commit message contains conventional commit prefix
          if echo "$COMMIT_MSG" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|chore|security)'; then
            echo "Processing commit: $COMMIT_MSG"
            
            # For commits, we need to extract the message differently
            COMMIT_TITLE=$(echo "$COMMIT_MSG" | head -1)
            REPO="${{ github.repository }}"
            
            # Create a changelog entry for the commit
            python .github/scripts/update_changelog.py CHANGELOG.md "$COMMIT_TITLE" "0" "$REPO" "$COMMIT_AUTHOR"
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update README and CHANGELOG [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
  
  chore:
    needs: build
    permissions:
      contents: read
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - 
        uses: actions/checkout@v6
      -
        name: Update repo description
        uses: peter-evans/dockerhub-description@v5
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ github.repository }}
          # readme-filepath: ./DOCKER.md

