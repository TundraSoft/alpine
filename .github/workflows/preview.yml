name: Branch preview

# On-demand branch image for local/dev testing. The Build workflow no longer
# pushes images for branches/PRs (they build + smoke-test only); run this from
# the Actions tab when you actually want a pullable image for a branch. Pushes
# only to GHCR under a branch-prefixed tag so Docker Hub stays clean.

on:
  workflow_dispatch:
    inputs:
      alpine-branch:
        description: 'Alpine branch (e.g. v3.24 or edge)'
        required: true
        default: edge
      platforms:
        description: 'Target platforms'
        required: true
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version and tag
        id: vars
        run: |
          if [ "${{ inputs.alpine-branch }}" = "edge" ]; then
            VERSION=edge
          else
            VERSION=$(curl -s --retry 3 --fail "https://cz.alpinelinux.org/alpine/${{ inputs.alpine-branch }}/releases/x86_64/latest-releases.yaml" | awk '/version:/ {print $2; exit}')
            [ -n "$VERSION" ] || { echo "Failed to resolve Alpine version for ${{ inputs.alpine-branch }}"; exit 1; }
          fi
          # Lower-case the image ref and sanitise the branch name for a Docker tag.
          TAG=$(echo "ghcr.io/${{ github.repository }}:$(echo '${{ github.ref_name }}' | tr '/' '-')-${VERSION}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.vars.outputs.tag }}
          build-args: |
            ALPINE_BRANCH=${{ inputs.alpine-branch }}

      - name: Summary
        run: echo "Pushed preview image \`${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
